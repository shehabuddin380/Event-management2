{% extends 'tasks/base.html' %}
{% block title %}Signup{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded border border-stone-200 shadow-sm mt-6">
    <h2 class="font-display text-2xl font-semibold mb-6 text-center text-indigo-950">Create an Account</h2>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}

        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-600 mb-1">
                {{ field.label }}
            </label>
            {{ field }}
            {% for error in field.errors %}
            <p class="text-xs text-red-600 mt-1">{{ error }}</p>
            {% endfor %}
        </div>
        {% endfor %}

        <button type="submit" class="w-full bg-indigo-950 text-white py-2 rounded hover:bg-indigo-900 transition-colors font-medium">
            Signup
        </button>
    </form>
    <p class="text-center mt-4 text-slate-500">
        Already have an account? <a href="{% url 'login' %}" class="text-amber-600 hover:underline">Login</a>
    </p>
</div>
{% endblock %}
